name: build + release

# Builds the bootstrap-tools tarball for linux/x86-64 and linux/aarch64
# in parallel matrix runners, then uploads both as assets on the
# matching GitHub Release.
#
# Triggers:
#   - pushed tag matching v*       -> full build + release
#   - workflow_dispatch             -> manual build, no release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create / upload to Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: linux+x86-64
            runner: ubuntu-latest
          - arch: aarch64
            triple: linux+aarch64
            runner: ubuntu-24.04-arm   # GitHub's native arm runner; falls back to qemu if unavailable

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: set version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }} \
            --build-arg ARCH=${{ matrix.arch }} \
            --output type=local,dest=./out \
            -f Dockerfile .
          mkdir -p dist
          mv out/bootstrap-tools-${{ matrix.triple }}.tar.xz \
            dist/bootstrap-tools-${{ steps.ver.outputs.version }}-${{ matrix.triple }}.tar.xz

      - name: sha256
        run: |
          cd dist
          sha256sum *.tar.xz > "bootstrap-tools-${{ steps.ver.outputs.version }}-${{ matrix.triple }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-tools-${{ matrix.triple }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## bootstrap-tools ${{ github.ref_name }}

            Seed toolchain for pkgxdev/pantry's HPC cascade. See
            [pkgxdev/pantry#12972](https://github.com/pkgxdev/pantry/issues/12972)
            for the rationale.

            ### Verify

            ```sh
            sha256sum -c bootstrap-tools-${{ github.ref_name }}-linux+x86-64.sha256
            sha256sum -c bootstrap-tools-${{ github.ref_name }}-linux+aarch64.sha256
            ```
